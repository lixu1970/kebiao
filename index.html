<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f7f9">
<title>教师/教室课表查询</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f6f7f9;color:#111;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
body{min-height:100vh}
.app{max-width:430px;margin:0 auto;padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
.page-title{text-align:center;font-size:22px;font-weight:900;line-height:1.25;margin:8px 0 14px;color:#111}
.top{display:flex;gap:5px;align-items:center;margin-bottom:7px}
h1{font-size:19px;margin:0;white-space:nowrap;font-weight:900}
.search{flex:1;min-width:0;display:flex;gap:5px;align-items:center}
input{flex:1;min-width:0;width:auto;height:44px;border:1px solid #cfd3d8;border-radius:10px;padding:0 7px;font-size:18px;background:#fff;outline:none}
button{height:44px;border:0;border-radius:10px;padding:0 8px;font-size:19px;font-weight:900;background:#111;color:#fff}
#go{flex:0 0 72px}
.hint{font-size:10.5px;color:#666;margin:0 0 5px 2px;min-height:14px}
.mode{font-weight:800;color:#111}
.grid{display:grid;grid-template-columns:31px repeat(3,1fr);gap:3px}
.cell,.day,.ph{background:#fff;border:1px solid #e3e5e8;border-radius:7px}
.ph{height:24px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#555;background:#eceff2}
.day{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;writing-mode:vertical-rl;letter-spacing:1px;background:#eceff2}
.cell{min-height:72px;padding:4px;overflow:hidden;position:relative}
.cell.free{display:flex;align-items:center;justify-content:center;color:#a3a7ad;font-size:12px;background:#fafafa}
.primary{font-size:13px;font-weight:900;line-height:1.1;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course{font-size:10px;font-weight:700;line-height:1.18;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:9px;color:#555;line-height:1.18;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.multi{position:absolute;right:3px;top:3px;font-size:8px;background:#111;color:#fff;border-radius:8px;padding:1px 4px}
.empty{margin-top:80px;text-align:center;color:#777;font-size:14px;line-height:1.7}
.finder{margin-top:8px}
.finder-title{font-size:15px;font-weight:900;margin:8px 2px 6px}
.finder-period{font-size:13px;font-weight:800;color:#555;margin:8px 2px 4px}
.finder-list{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.finder-item{background:#fff;border:1px solid #e3e5e8;border-radius:8px;padding:8px 9px;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.finder-name{font-size:16px;font-weight:900;white-space:nowrap}
.finder-room{font-size:14px;font-weight:800;color:#444;text-align:right;overflow-wrap:anywhere}
.finder-none{background:#fafafa;border:1px solid #e3e5e8;border-radius:8px;padding:14px;text-align:center;color:#999;font-size:14px}

.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding:12px 14px calc(14px + env(safe-area-inset-bottom));transform:translateY(110%);transition:.2s;z-index:9;max-height:76vh;overflow:auto}
.sheet.show{transform:translateY(0)}
.sheet h2{font-size:17px;margin:0 0 8px;padding-right:60px}
.detail{border-top:1px solid #eee;padding:8px 0;font-size:13px;line-height:1.55}
.close{position:absolute;right:12px;top:10px;background:#eee;color:#222;height:30px}
@media(max-height:600px){
 .app{padding-top:4px}
 .cell{min-height:64px;padding:3px}
 .course{font-size:9.5px}
 .meta{font-size:8.5px}
 h1{font-size:18px}
}
</style>
</head>
<body>
<div class="app">
  <div class="page-title">26-27-1前十周课表</div>
  <div class="top">
    <h1>课表查询</h1>
    <div class="search">
      <input id="q" list="choices" placeholder="教师 / 教室 / 一12" autocomplete="off">
      <datalist id="choices"></datalist>
      <button id="go">查询</button>
    </div>
  </div>
  <div class="hint" id="hint">可查教师、教室；输入“一”或“一12”可快速找老师</div>
  <div id="content" class="empty">输入 <b>刘运琦</b> 可查教师课表<br>输入 <b>D1</b> 可查该教室周一至周五谁在上课</div>
</div>

<div class="sheet" id="sheet">
  <button class="close" id="close">关闭</button>
  <h2 id="sheetTitle"></h2>
  <div id="sheetBody"></div>
</div>

const q=document.getElementById('q'), go=document.getElementById('go'),
      content=document.getElementById('content'), hint=document.getElementById('hint'),
      dl=document.getElementById('choices');

function norm(s){return String(s??'').trim().replace(/\s+/g,'').toUpperCase()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

DATA.teachers.forEach(n=>{const o=document.createElement('option');o.value=n;o.label='教师';dl.appendChild(o)});
DATA.rooms.forEach(n=>{const o=document.createElement('option');o.value=n;o.label='教室';dl.appendChild(o)});


function parseFinderQuery(raw){
  const v=String(raw??'').trim().replace(/\s+/g,'');
  const m=v.match(/^(?:周)?([一二三四五])(?:(12|34|56))?$/);
  if(!m) return null;
  const dayMap={一:'周一',二:'周二',三:'周三',四:'周四',五:'周五'};
  const periodMap={'12':'1、2','34':'3、4','56':'5、6'};
  return {day:dayMap[m[1]], period:m[2]?periodMap[m[2]]:null, shortDay:m[1], shortPeriod:m[2]||''};
}

function finderRecords(day, period){
  const rows=[];
  Object.entries(DATA.records).forEach(([teacher,recs])=>{
    recs.forEach(r=>{
      if(r.day!==day) return;
      if(period && r.period!==period) return;
      rows.push({teacher,room:r.room,period:r.period});
    });
  });
  const seen=new Set();
  return rows.filter(r=>{
    const k=[r.teacher,r.room,r.period].join('|');
    if(seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}

function renderFinder(f){
  const rows=finderRecords(f.day,f.period);
  q.value=f.shortDay+f.shortPeriod;
  hint.innerHTML='<span class="mode">找老师：</span>'+esc(f.day)+(f.period?' '+esc(f.period)+'节':' 全天')+'｜仅显示教师和教室';

  let out='<div class="finder"><div class="finder-title">'+esc(f.day)+(f.period?' '+esc(f.period)+'节':' 任课教师位置')+'</div>';
  const periods=f.period?[f.period]:DATA.periods;
  let any=false;

  periods.forEach(period=>{
    const arr=rows.filter(r=>r.period===period);
    if(!arr.length) return;
    any=true;
    out+='<div class="finder-period">'+esc(period)+'节</div><div class="finder-list">';
    arr.sort((a,b)=>a.teacher.localeCompare(b.teacher,'zh-CN')).forEach(r=>{
      out+='<div class="finder-item"><div class="finder-name">'+esc(r.teacher)+'</div><div class="finder-room">'+esc(r.room)+'</div></div>';
    });
    out+='</div>';
  });

  if(!any) out+='<div class="finder-none">这一时段没有任课教师</div>';
  out+='</div>';
  content.className='';
  content.innerHTML=out;
}

function resolve(raw){
  const v=raw.trim(), nv=norm(v);
  if(!v) return null;

  const teacherExact=DATA.teachers.find(n=>norm(n)===nv);
  if(teacherExact) return {type:'teacher', key:teacherExact};

  const roomExact=DATA.rooms.find(n=>norm(n)===nv);
  if(roomExact) return {type:'room', key:roomExact};

  const teacherHits=DATA.teachers.filter(n=>norm(n).includes(nv));
  const roomHits=DATA.rooms.filter(n=>norm(n).includes(nv));
  const hits=[
    ...teacherHits.map(x=>({type:'teacher',key:x})),
    ...roomHits.map(x=>({type:'room',key:x}))
  ];
  return hits.length===1 ? hits[0] : {type:'ambiguous', hits};
}

function recordsFor(res){
  return res.type==='teacher' ? (DATA.records[res.key]||[]) : (DATA.room_records[res.key]||[]);
}

function render(){
  const raw=q.value.trim();
  if(!raw){hint.textContent='请输入教师姓名、教室，或星期快捷码';return}

  const finder=parseFinderQuery(raw);
  if(finder){renderFinder(finder);return}

  const res=resolve(raw);

  if(!res || res.type==='ambiguous'){
    const hits=res?.hits||[];
    if(hits.length){
      hint.textContent='找到多个匹配：'+hits.slice(0,8).map(x=>x.key).join('、')+(hits.length>8?'…':'');
    }else{
      hint.textContent='没有找到“'+raw+'”';
    }
    return;
  }

  q.value=res.key;
  const recs=recordsFor(res);
  const isTeacher=res.type==='teacher';
  hint.innerHTML='<span class="mode">'+(isTeacher?'教师':'教室')+'查询：</span>'+esc(res.key)+'｜点击有课格查看完整信息';

  let out='<div class="grid"><div></div>';
  DATA.periods.forEach(p=>out+='<div class="ph">'+p+'节</div>');

  DATA.days.forEach(day=>{
    out+='<div class="day">'+day+'</div>';
    DATA.periods.forEach(period=>{
      if((day==='周一'||day==='周五') && period==='5、6'){
        out+='<div class="cell free" style="visibility:hidden;border-color:transparent;background:transparent"></div>';
        return;
      }
      const arr=recs.filter(r=>r.day===day && r.period===period);
      if(!arr.length){
        out+='<div class="cell free">无课</div>';
      }else{
        const r=arr[0];
        const idxs=arr.map(x=>recs.indexOf(x)).join(',');
        const primary=isTeacher ? ('教室：'+r.room) : r.teacher;
        out+=`<div class="cell" data-type="${res.type}" data-key="${esc(res.key)}" data-idx="${idxs}">
          ${arr.length>1?'<span class="multi">'+arr.length+'项</span>':''}
          <div class="primary">${esc(primary)}</div>
          <div class="course">${esc(r.course)}</div>
          <div class="meta">${esc(r.class)}${r.count?'（'+esc(r.count)+'人）':''}</div>
          <div class="meta">班主任：${esc(r.head)}</div>
        </div>`;
      }
    });
  });
  out+='</div>';
  content.className='';
  content.innerHTML=out;
  content.querySelectorAll('.cell[data-idx]').forEach(el=>el.addEventListener('click',()=>showDetails(res, el.dataset.idx)));
}

function showDetails(res, idxstr){
  const recs=recordsFor(res);
  const arr=idxstr.split(',').map(Number).map(i=>recs[i]).filter(Boolean);
  if(!arr.length) return;
  document.getElementById('sheetTitle').textContent=(res.type==='teacher'?'教师 ':'教室 ')+res.key+'｜'+arr[0].day+' '+arr[0].period+'节';
  document.getElementById('sheetBody').innerHTML=arr.map(r=>`
    <div class="detail">
      <b>${esc(r.course)}</b><br>
      教师：<b>${esc(res.type==='teacher'?res.key:r.teacher)}</b><br>
      班级：${esc(r.class)}${r.count?'（'+esc(r.count)+'人）':''}<br>
      班主任：${esc(r.head)}<br>
      教室：<b>${esc(r.room)}</b>
    </div>`).join('');
  document.getElementById('sheet').classList.add('show');
}

document.getElementById('close').onclick=()=>document.getElementById('sheet').classList.remove('show');
go.onclick=render;
q.addEventListener('keydown',e=>{if(e.key==='Enter')render()});
q.addEventListener('change',()=>{ if(q.value.trim()) render(); });
</script>
