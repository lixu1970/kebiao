<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="倒计时"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>倒计时</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(160deg,#0f172a,#1f2937 55%,#111827);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom))}.wrap{max-width:560px;margin:auto}.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:26px;padding:22px 18px;margin-bottom:14px}h1,h2{text-align:center;margin:0}h1{font-size:30px}h2{font-size:22px}.sub{text-align:center;opacity:.7;margin:7px 0 18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0}.unit{background:rgba(255,255,255,.09);border-radius:17px;padding:15px 4px;text-align:center}.num{font-size:clamp(29px,9vw,45px);font-weight:800}.lab{font-size:12px;opacity:.7;margin-top:7px}input,button{width:100%;border:0;border-radius:14px;padding:13px 14px;font-size:16px}input{background:#fff;color:#111827;margin:6px 0}button{font-weight:750;background:#fff;color:#111827}.secondary{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.15)}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}.target{text-align:center;min-height:24px;margin:8px 0 12px}.shorttime{text-align:center;font-size:48px;font-weight:850;margin:15px 0}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0}.quick button{padding:10px 3px;font-size:14px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.14)}.custom{display:grid;grid-template-columns:1fr 1.2fr;gap:8px}.hint{font-size:12px;opacity:.62;line-height:1.55;text-align:center;margin-top:12px}.alarm{display:none;text-align:center;background:#fff;color:#111827;border-radius:16px;padding:14px;margin:12px 0;font-weight:800}.alarm button{margin-top:10px;background:#111827;color:#fff}</style></head><body><main class="wrap">
<section class="card"><h1 id="titleView">倒计时</h1><div class="sub">长期目标倒计时</div><div class="grid"><div class="unit"><div id="d" class="num">0</div><div class="lab">天</div></div><div class="unit"><div id="h" class="num">00</div><div class="lab">时</div></div><div class="unit"><div id="m" class="num">00</div><div class="lab">分</div></div><div class="unit"><div id="s" class="num">00</div><div class="lab">秒</div></div></div><div id="target" class="target">请设置目标时间</div><input id="name" placeholder="倒计时名称，例如：退休、生日、旅行"><input id="date" type="datetime-local"><div class="row"><button id="longStart">开始倒计时</button><button id="longClear" class="secondary">清除</button></div></section>
<section class="card"><h2>短时倒计时</h2><div class="sub">休息、学习、做饭等，可反复使用</div><div id="shortDisplay" class="shorttime">20:00</div><div class="quick"><button data-min="10">10分钟<br><small>课间休息</small></button><button data-min="20">20分钟<br><small>用眼休息</small></button><button data-min="30">30分钟<br><small>午间休息</small></button><button data-min="45">45分钟<br><small>上课</small></button></div><div class="custom"><input id="customMin" type="number" min="1" max="999" value="20" inputmode="numeric"><button id="setCustom">设定分钟</button></div><div class="row"><button id="shortStart">开始 / 暂停</button><button id="shortReset" class="secondary">复位</button></div><button id="systemTimer" class="secondary" style="margin-top:9px">🔔 用苹果系统计时提醒</button><div id="alarm" class="alarm">⏰ 时间到了！<button id="dismiss">停止提醒并复位</button></div><div class="hint">网页只负责倒计时显示，不再播放声音或震动；锁屏后的响铃和亮屏由“用苹果系统计时提醒”启动的苹果系统计时器负责。</div></section></main>
<script>const $=i=>document.getElementById(i),pad=n=>String(n).padStart(2,'0');let lt,st,dur=1200,rem=1200,end=0,running=false,ac=null,ai=null;
function audio(){}
function beep(){}
function ring(){$('alarm').style.display='block'}function stopRing(){clearInterval(ai);ai=null;$('alarm').style.display='none'}
function updL(){let ts=Number(localStorage.getItem('countdown_target')||0),x=ts-Date.now();if(!ts||x<=0){$('d').textContent='0';$('h').textContent=$('m').textContent=$('s').textContent='00';return}let t=Math.floor(x/1000);$('d').textContent=Math.floor(t/86400);$('h').textContent=pad(Math.floor(t%86400/3600));$('m').textContent=pad(Math.floor(t%3600/60));$('s').textContent=pad(t%60)}
function loadL(){let title=localStorage.getItem('countdown_title')||'倒计时',ts=Number(localStorage.getItem('countdown_target')||0);$('titleView').textContent=title;$('name').value=title==='倒计时'?'':title;if(ts){let x=new Date(ts);$('target').textContent=`目标：${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())} ${pad(x.getHours())}:${pad(x.getMinutes())}`}else $('target').textContent='请设置目标时间';updL();clearInterval(lt);lt=setInterval(updL,1000)}
$('longStart').onclick=()=>{if(!$('date').value)return alert('请先选择目标日期和时间');localStorage.setItem('countdown_target',new Date($('date').value).getTime());localStorage.setItem('countdown_title',$('name').value.trim()||'倒计时');loadL()};$('longClear').onclick=()=>{localStorage.removeItem('countdown_target');localStorage.removeItem('countdown_title');$('name').value='';$('date').value='';loadL()};
function draw(v){v=Math.max(0,Math.ceil(v));$('shortDisplay').textContent=`${pad(Math.floor(v/60))}:${pad(v%60)}`}function choose(v){stopRing();running=false;clearInterval(st);dur=rem=v;draw(v)}document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>choose(+b.dataset.min*60));$('setCustom').onclick=()=>choose(Math.max(1,Math.min(999,+$('customMin').value||20))*60);
$('shortStart').onclick=()=>{audio();stopRing();if(running){rem=Math.max(0,(end-Date.now())/1000);running=false;clearInterval(st);draw(rem);return}if(rem<=0)rem=dur;end=Date.now()+rem*1000;running=true;clearInterval(st);st=setInterval(()=>{rem=(end-Date.now())/1000;if(rem<=0){rem=0;running=false;clearInterval(st);draw(0);ring()}else draw(rem)},250)};
$('systemTimer').onclick=()=>{let minutes=Math.max(1,Math.round((running?Math.max(0,(end-Date.now())/1000):rem)/60)||Math.round(dur/60)||20);let url='shortcuts://run-shortcut?name='+encodeURIComponent('倒计时提醒')+'&input=text&text='+encodeURIComponent(String(minutes));window.location.href=url;};$('shortReset').onclick=()=>choose(dur);$('dismiss').onclick=()=>{stopRing();choose(dur)};document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running){rem=(end-Date.now())/1000;if(rem<=0){rem=0;running=false;clearInterval(st);draw(0);ring()}else draw(rem)}});if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{})}loadL();draw(rem);</script></body></html>
